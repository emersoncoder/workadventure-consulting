services:
  web:
    image: node:22-alpine
    container_name: workadventure-site
    working_dir: /app
    ports:
      - "8080:5173" # Mapeia a porta 8080 do seu PC para a 5173 do container
    volumes:
      - .:/app
      - /app/node_modules # Protege a pasta node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"